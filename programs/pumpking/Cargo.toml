[package]
name = "pumpking"
version = "0.1.0"
edition = "2021"
description = "Parametric drought cover settled from a DePIN sensor median"

[lib]
crate-type = ["cdylib", "lib"]
name = "pumpking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
# `#[account(zero_copy)]` derives `Pod`/`Zeroable` through the crate's own
# `bytemuck`, so it has to be a direct dependency. Pinned to the version
# anchor-lang already brings — the lock does not move.
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }

[dev-dependencies]
# Плетіння акаунтів (init, сіди, token::authority) перевіряє лише справжній
# рантайм: `cargo test --lib` бачить чисті функції й більше нічого.
mollusk-svm = "0.15.0"
# SPL Token окремим крейтом: `initialize_pool` створює обидва сховища через CPI,
# `issue_policy` і `settle_policy` цією ж програмою переказують гроші. Без ELF
# токен-програми жодна з трьох не доходить до кінця. token-2022 і ATA не потрібні.
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = ["token"] }
# Гілка типів у mollusk (agave 4.x) не та, у якій живе anchor-lang 0.32.1
# (solana-program 2.3). Це два різні `Pubkey`, і міст між ними — `to_bytes()`.
solana-account = "4.3"
solana-instruction = "3.4"
solana-pubkey = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
