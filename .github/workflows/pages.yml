name: Pages

# The interface, on GitHub Pages — T056. The API and the aggregation loop live
# on Render (`render.yaml`); nothing here talks to a database or a cluster.
#
# `VITE_*` values are baked into the bundle at build time, so changing one means
# re-running this workflow, not restarting anything. They are also public once
# built: nothing secret goes in them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a queued one is not thrown away: a cancelled deploy
# leaves the site on whatever was published last, which is fine, but a lost one
# leaves the show pointing at yesterday.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # The landing owns the site's root and the app lives under app/
          # (T070), so the bundle is built for /<repo>/app/. A custom domain
          # sets PAGES_BASE_PATH to /app/.
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_POLICY_PUBKEY: ${{ vars.VITE_POLICY_PUBKEY }}
          VITE_ASSET_DECIMALS: ${{ vars.VITE_ASSET_DECIMALS }}
          # T038a: where a phone sends its registration; unset is public devnet.
          VITE_SOLANA_RPC_URL: ${{ vars.VITE_SOLANA_RPC_URL }}
          VITE_PUMPKING_PROGRAM_ID: ${{ vars.VITE_PUMPKING_PROGRAM_ID }}
        run: pnpm --filter @pumpking/web build

      # One artifact, two folders: the static landing at the root, the app
      # under app/. The landing has no build step and no package.json, so
      # pnpm never sees it; it is copied as it is.
      #
      # Pages answers an unknown path with the root 404.html only (a nested
      # one is ignored), and the app has no paths of its own — the screens are
      # switched in state, the only parameters are ?policy= and ?view=. So the
      # fallback is the landing, given a <base> for the site's root: its links
      # are relative, and from /<repo>/some/old/link they would resolve under
      # /some/old/ without it.
      - name: Assemble the site
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
        run: |
          site_root="${BASE_PATH%app/}"
          mkdir -p dist
          cp -r apps/landing/. dist/
          cp -r apps/web/dist dist/app
          sed "s|<head>|<head>\n<base href=\"${site_root}\">|" apps/landing/index.html > dist/404.html
          grep -q "<base href=\"${site_root}\">" dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
