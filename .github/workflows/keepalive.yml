name: Keep-alive

# Render's free plan idles a service after 15 minutes of silence, and a cold
# start takes about a minute. A sleeping service is a sleeping aggregator: no
# day is written while it sleeps, and a day with no coverage ends a run — so
# this ping is part of the deployment (T056), not housekeeping.
#
# Every five minutes rather than every ten: GitHub's schedule runs late by
# minutes, and the threshold is fifteen. GitHub also disables scheduled
# workflows after 60 days without a commit — re-enable it in the Actions tab.
#
# It pings from outside both processes on purpose. The worker's own
# KEEPALIVE_URL exists for the two-service deployment; inside the API a process
# pinging itself proves nothing about whether it is awake.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Nothing to wake before the API exists (step 2 of the deploy runbook),
      # and a cross every five minutes until then would teach everyone to
      # ignore the one that eventually means something.
      - name: Ping /health
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "VITE_API_URL is not set — nothing deployed yet, skipping."
            exit 0
          fi
          # --max-time 120 covers a cold start. The first part of the answer is
          # enough to see the loop turning: cycles, and why the last one skipped.
          curl -sSf --max-time 120 "$API_URL/health" | cut -c1-200
